name: Cripto IA - escaneo y publicación

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'futures.js'
      - 'tests/futures.test.js'
      - 'tests/ui.test.js'
      - 'public/index.html'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/cripto-ia.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cripto-ia-produccion
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unificar interfaz principal y GitHub Pages
        run: |
          cp index.html public/index.html
          cp futures.js public/futures.js

      - name: Validar sintaxis del motor y del panel
        run: |
          node --check server.js
          node --check futures.js
          node tests/futures.test.js
          node tests/ui.test.js
          node -e "const fs=require('fs');const s=fs.readFileSync('public/index.html','utf8');const a=s.indexOf('<script>'),b=s.indexOf('</script>',a);if(a<0||b<0)throw Error('Panel sin script');new Function(s.slice(a+8,b));"

      - name: Verificar fuente alterna de futuros (datos públicos)
        run: |
          node - <<'NODE'
          (async()=>{
            const base='https://api.gateio.ws/api/v4/futures/usdt';
            for(const url of [base+'/tickers?contract=BTC_USDT',base+'/candlesticks?contract=BTC_USDT&interval=5m&limit=4']){
              try{
                const r=await fetch(url,{signal:AbortSignal.timeout(10000)});
                const json=await r.json().catch(()=>null);
                console.log('Gate Futures probe',r.status,url.includes('candlesticks')?'klines':'tickers',
                  Array.isArray(json)?'items='+json.length:'respuesta no disponible');
              }catch(e){console.log('Gate Futures probe ERROR',String(e.message).slice(0,120));}
            }
          })().catch(e=>console.log('Gate Futures probe error',String(e)));
          NODE

      - name: Escanear mercado y guardar resultados
        env:
          ONESHOT: '1'
          DATA_PATH: public/data/results.json
        run: |
          mkdir -p public/data
          node server.js
          node -e "const s=require('./public/data/results.json'); if(!s.spot?.updatedAt && !s.dex?.updatedAt) process.exit(1)"

      - name: Guardar resultado en GitHub de forma segura
        run: |
          set -e
          cp public/data/results.json /tmp/cripto-results.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            # Only the single generated data file is committed; preserve the latest
            # user-edited source files even when they changed during scanning.
            git reset --hard origin/main
            cp /tmp/cripto-results.json public/data/results.json
            git add public/data/results.json
            if git diff --cached --quiet; then
              echo "Resultados ya actualizados"
              break
            fi
            git commit -m "Actualizar radar cripto automáticamente [skip ci]"
            if git push origin HEAD:main; then
              echo "Resultados guardados"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "No se pudieron guardar los resultados tras cinco reintentos" >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
          cp index.html public/index.html
          cp futures.js public/futures.js

      - name: Comprobar GitHub Pages
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getPages({ owner: context.repo.owner, repo: context.repo.repo });
              core.setOutput('enabled', 'true');
            } catch (error) {
              if (error.status === 404) {
                try {
                  await github.rest.repos.createPagesSite({
                    owner: context.repo.owner, repo: context.repo.repo, build_type: 'workflow'
                  });
                  core.info('GitHub Pages activado automáticamente.');
                  core.setOutput('enabled', 'true');
                } catch (enableError) {
                  core.warning('No se pudo activar GitHub Pages: ' + enableError.message);
                  core.setOutput('enabled', 'false');
                }
              } else if (error.status === 403) {
                core.warning('Acceso insuficiente a GitHub Pages.');
                core.setOutput('enabled', 'false');
              } else {
                throw error;
              }
            }

      - name: Preparar sitio estático
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  publish:
    needs: scan
    if: needs.scan.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar radar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
